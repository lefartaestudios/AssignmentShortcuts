<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assignment Shortcuts</title>
<script>try{if(JSON.parse(localStorage.getItem("notblank.ui"))==="simple")document.documentElement.setAttribute("data-ui","simple")}catch(e){}</script>
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#f4f5f7;--fg:#12151b;--accent:#12151b;--accent-fg:#ffffff;--ring:#12151b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--fg:#e7eaf0;--accent:#5eead4;--accent-fg:#0b1210;--ring:#5eead4}}
:root[data-theme="dark"]{--bg:#0e1014;--fg:#e7eaf0;--accent:#5eead4;--accent-fg:#0b1210;--ring:#5eead4}
html,body{height:100%;margin:0}
body{background:radial-gradient(60rem 40rem at 50% 40%,color-mix(in srgb,var(--accent) 12%,var(--bg)),var(--bg));color:var(--fg);display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hub{width:min(36rem,92vw);display:flex;flex-direction:column;gap:1.75rem;text-align:center;padding:1.5rem 0}
h1{margin:0;font-size:clamp(1.45rem,4.6vw,2.1rem);line-height:1.25;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem}
.shortcut{text-decoration:none;display:flex;align-items:center;gap:.9rem;font:600 1.1rem/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:.9rem 1.1rem;border:1px solid color-mix(in srgb,var(--fg) 16%,transparent);background:color-mix(in srgb,var(--fg) 6%,var(--bg));color:var(--fg);border-radius:16px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.shortcut img{flex:none;width:36px;height:36px;box-sizing:border-box;padding:4px;border-radius:10px;background:#fff}
.shortcut:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 22%,transparent)}
.shortcut:active{transform:translateY(0)}
.shortcut:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.uipick{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:color-mix(in srgb,var(--fg) 70%,transparent)}
.uipick select{font:inherit;padding:.35rem .6rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);background:var(--bg);color:var(--fg)}
.uipick select:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
:root[data-ui="simple"]{--bg:#f2f2ee;--fg:#16181d;--accent:#16181d;--accent-fg:#f2f2ee;--ring:#16181d}
:root[data-ui="simple"] body{background:var(--bg);font-family:"Courier New",monospace}
:root[data-ui="simple"] h1{font-family:"Courier New",monospace;letter-spacing:0}
:root[data-ui="simple"] .shortcut{font-family:"Courier New",monospace;border:2px solid var(--fg);background:var(--bg);border-radius:0;box-shadow:none}
:root[data-ui="simple"] .shortcut img{border-radius:0;border:1px solid var(--fg)}
:root[data-ui="simple"] .shortcut:hover{background:var(--fg);color:var(--bg);transform:none;box-shadow:none}
:root[data-ui="simple"] .uipick select{font-family:"Courier New",monospace;border:2px solid var(--fg);border-radius:0}
</style>
</head>
<body>

<div class="uipick"><label for="ui">Interface</label><select id="ui"><option value="futuristic">Futuristic Like</option><option value="simple">Simplastic Prototype</option></select></div>
<script>
(function () {
  var TITLE = "About:NotBlank";                 // loading pages and the sites you open
  var LAUNCHER_TITLE = "Assignment Shortcut";   // the address page
  // Default tab icon: favicon.ico next to this page (about:blank tabs need the full address).
  var HOME_ICON = /^https?:$/.test(location.protocol)
    ? new URL("favicon.ico", location.href).href
    : "https://raw.githubusercontent.com/lefartaestudios/AssignmentShortcuts/refs/heads/main/favicon.ico";
  // Optional: your own proxy (the Cloudflare Worker in worker.js or the Node server in
  // server.js). Its address is typed into the launcher page and saved; with it empty,
  // sites are requested directly from the browser. applyProxy() fills in the values below.
  var PROXY_URL = "", PROXY_BASE = "", DIRECT = null;
  var CAN_HTTP = false;     // a page served over https cannot request plain http:// directly
  var MAX_FILES = 200, MAX_BYTES = 30 * 1024 * 1024, MAX_FILE = 6 * 1024 * 1024;
  var PAGE_TIMEOUT = 20000, ASSET_TIMEOUT = 12000;
  function secureUrl(u) { return CAN_HTTP ? u : u.replace(/^http:/i, "https:"); }
  var ICON_TAG = '<link rel="icon" href="' + HOME_ICON + '">';

  function normalize(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  function lockTitle(w, fallback) {
    function want() { var c = ctxs.get(w); return (c && c.title) || fallback || TITLE; }
    try {
      w.document.title = want();
      var t = w.document.querySelector("title");
      if (t) new w.MutationObserver(function () {
        if (w.document.title !== want()) w.document.title = want();
      }).observe(t, { childList: true, characterData: true, subtree: true });
    } catch (e) {}
  }

  function showFrame(w, url) {
    w.document.open();
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + TITLE +
      '</title><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head><body></body></html>');
    w.document.close();
    var f = w.document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-downloads");
    f.src = url;
    w.document.body.appendChild(f);
    lockTitle(w);
  }

  async function fetchText(u) {
    var r = await fetch(u, { mode: "cors" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return { text: await r.text(), url: r.url };
  }

  function writeDoc(w, html, baseHref) {
    var base = '<base href="' + baseHref.replace(/"/g, "&quot;") + '">';
    html = /<head[^>]*>/i.test(html)
      ? html.replace(/<head[^>]*>/i, function (m) { return m + base; })
      : base + html;
    w.document.open();
    w.document.write(html);
    w.document.close();
    lockTitle(w);
  }

  // ---- Interface styles ---------------------------------------------------
  // "Futuristic Like" is the current look; "Simplastic Prototype" is the original plain
  // look. They only change colours, fonts and shapes, never how anything works.
  var UI_FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  var THEMES = {
    futuristic: {
      name: "Futuristic Like", font: UI_FONT,
      pageBg: "#0e1014", launcherBg: "radial-gradient(50rem 30rem at 50% 20%,#14312f,#0e1014)",
      card: "#161a21", cardBorder: "1px solid #2a303b", cardShadow: "0 20px 60px rgba(0,0,0,.5)",
      r: "20px", rPanel: "16px", rSm: "12px", rIn: "10px", pill: "999px",
      text: "#e7eaf0", muted: "#9aa3b2", faint: "#6f7888", link: "#5eead4", ring: "#5eead4",
      inputBg: "#0e1014", inputBorder: "1px solid #2a303b", placeholder: "#5d6675",
      priBg: "#5eead4", priFg: "#0b1210", priBorder: "0", priHoverBg: "#7ff0de", priHoverFg: "#0b1210",
      btnBg: "#161a21", btnFg: "#e7eaf0", btnBorder: "1px solid #2a303b", btnShadow: "0 6px 24px rgba(0,0,0,.45)",
      btnHoverBg: "#222833", btnHoverFg: "#e7eaf0",
      msgShadow: "0 6px 24px rgba(0,0,0,.45)", panelShadow: "0 14px 48px rgba(0,0,0,.55)",
      spinBase: "#2a303b", spinTop: "#5eead4", dot: "inline-block", warn: "#fca5a5"
    },
    simple: {
      name: "Simplastic Prototype", font: '"Courier New",monospace',
      pageBg: "#f2f2ee", launcherBg: "#f2f2ee",
      card: "#f2f2ee", cardBorder: "2px solid #16181d", cardShadow: "none",
      r: "0", rPanel: "0", rSm: "0", rIn: "0", pill: "0",
      text: "#16181d", muted: "#4a4d55", faint: "#6b6e76", link: "#16181d", ring: "#16181d",
      inputBg: "#ffffff", inputBorder: "2px solid #16181d", placeholder: "#8a8d95",
      priBg: "#16181d", priFg: "#f2f2ee", priBorder: "2px solid #16181d", priHoverBg: "transparent", priHoverFg: "#16181d",
      btnBg: "#f2f2ee", btnFg: "#16181d", btnBorder: "2px solid #16181d", btnShadow: "0 2px 6px rgba(0,0,0,.3)",
      btnHoverBg: "#16181d", btnHoverFg: "#f2f2ee",
      msgShadow: "0 2px 6px rgba(0,0,0,.3)", panelShadow: "0 2px 10px rgba(0,0,0,.35)",
      spinBase: "#d4d4cd", spinTop: "#16181d", dot: "none", warn: "#9b1c1c"
    }
  };
  var UI_OPTIONS = '<option value="futuristic">' + THEMES.futuristic.name + '</option>' +
    '<option value="simple">' + THEMES.simple.name + '</option>';
  function uiKey() { var k = store("notblank.ui", "futuristic"); return THEMES[k] ? k : "futuristic"; }
  function theme() { return THEMES[uiKey()]; }

  function pageCss() {
    var t = theme();
    return 'html,body{height:100%;margin:0}' +
      'body{background:' + t.pageBg + ';color:' + t.text + ';font-family:' + t.font + ';display:grid;place-items:center}' +
      '.card{width:min(30rem,90vw);box-sizing:border-box;background:' + t.card + ';border:' + t.cardBorder + ';border-radius:' + t.r + ';padding:1.5rem;box-shadow:' + t.cardShadow + '}' +
      'h2{margin:0 0 .5rem;font-size:1.1rem}p{margin:.4rem 0;color:' + t.muted + ';line-height:1.5}' +
      'ul{color:' + t.muted + ';padding-left:1.2rem;font-size:.85rem;line-height:1.5}a{color:' + t.link + '}' +
      '.spin{width:22px;height:22px;border:3px solid ' + t.spinBase + ';border-top-color:' + t.spinTop + ';border-radius:50%;animation:s .8s linear infinite;margin-bottom:.8rem}' +
      '@keyframes s{to{transform:rotate(360deg)}}' +
      '.lblx{margin-top:1.1rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:' + t.muted + '}' +
      '.modes{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}' +
      '.mode{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem .75rem;border:' + t.inputBorder + ';border-radius:' + t.rSm + ';background:' + t.inputBg + ';cursor:pointer}' +
      '.mode:has(input:checked){outline:2px solid ' + t.ring + '}' +
      '.mode input{margin:.2rem 0 0;accent-color:' + t.ring + '}' +
      '.mode b{display:block;font-size:.92rem}.mode small{display:block;color:' + t.muted + ';line-height:1.35;margin-top:.1rem}' +
      '.mode small.warn{color:' + t.warn + ';font-weight:600}';
  }

  function launcherCss() {
    var t = theme();
    return '*{box-sizing:border-box}' +
      'body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem 0;background:' + t.launcherBg + ';color:' + t.text + ';font-family:' + t.font + '}' +
      '.card{width:min(30rem,92vw);background:' + t.card + ';border:' + t.cardBorder + ';border-radius:' + t.r + ';padding:1.75rem;box-shadow:' + t.cardShadow + '}' +
      'form{display:flex;flex-direction:column;gap:1rem}' +
      '.brand{display:flex;align-items:center;gap:.6rem}' +
      '.dot{display:' + t.dot + ';width:12px;height:12px;border-radius:50%;background:' + t.priBg + ';box-shadow:0 0 14px ' + t.priBg + '}' +
      'h1{margin:0;font-size:1.3rem}.sub{margin:-.4rem 0 0;color:' + t.muted + ';font-size:.9rem}' +
      '.lbl{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:' + t.muted + ';margin-bottom:.35rem;display:block}' +
      'input[type=text],select{width:100%;font:1rem ' + t.font + ';padding:.85rem 1rem;border:' + t.inputBorder + ';background:' + t.inputBg + ';color:' + t.text + ';border-radius:' + t.rSm + '}' +
      'input[type=text]::placeholder{color:' + t.placeholder + '}' +
      'input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid ' + t.ring + ';outline-offset:2px}' +
      'button.primary{font:600 1rem ' + t.font + ';padding:.95rem 1rem;border:' + t.priBorder + ';border-radius:' + t.rSm + ';background:' + t.priBg + ';color:' + t.priFg + ';cursor:pointer}' +
      'button.primary:hover{background:' + t.priHoverBg + ';color:' + t.priHoverFg + '}' +
      '#s{min-height:1.2em;font-size:.9rem;color:' + t.muted + '}' +
      '.foot{margin:0;color:' + t.faint + ';font-size:.8rem;line-height:1.5}' +
      '.modes{display:flex;flex-direction:column;gap:.5rem;margin-top:.35rem}' +
      '.mode{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem .75rem;border:' + t.inputBorder + ';border-radius:' + t.rSm + ';background:' + t.inputBg + ';cursor:pointer}' +
      '.mode:has(input:checked){outline:2px solid ' + t.ring + '}' +
      '.mode input{margin:.2rem 0 0;accent-color:' + t.ring + '}' +
      '.mode b{display:block;font-size:.92rem}.mode small{display:block;color:' + t.muted + ';line-height:1.35;margin-top:.1rem}' +
      '.mode small.warn{color:' + t.warn + ';font-weight:600}';
  }

  function panelCss(t) {
    var F = t.font;
    return '.wrap{display:flex;flex-direction:column;align-items:flex-end;gap:10px;font:13px ' + F + ';color:' + t.text + '}' +
      '.bar{display:flex;align-items:center;gap:8px}' +
      '.msg{background:' + t.card + ';border:' + t.btnBorder + ';border-radius:' + t.rIn + ';padding:8px 12px;max-width:60vw;box-shadow:' + t.msgShadow + ';line-height:1.4}' +
      '.msg:empty{display:none}' +
      'button{font:600 13px ' + F + ';padding:8px 14px;border:' + t.btnBorder + ';background:' + t.btnBg + ';color:' + t.btnFg + ';cursor:pointer;border-radius:' + t.pill + ';box-shadow:' + t.btnShadow + ';transition:background .15s}' +
      'button:hover{background:' + t.btnHoverBg + ';color:' + t.btnHoverFg + '}' +
      'button.pri{background:' + t.priBg + ';color:' + t.priFg + ';border:' + t.priBorder + '}' +
      'button.pri:hover{background:' + t.priHoverBg + ';color:' + t.priHoverFg + '}' +
      'button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid ' + t.ring + ';outline-offset:2px}' +
      '.panel{width:min(23rem,calc(100vw - 24px));box-sizing:border-box;background:' + t.card + ';border:' + t.cardBorder + ';border-radius:' + t.rPanel + ';padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:' + t.panelShadow + ';max-height:72vh;overflow:auto}' +
      '.panel[hidden]{display:none}' +
      '.head{display:flex;align-items:center;justify-content:space-between}.head h3{margin:0;font:600 14px ' + F + '}' +
      '.x{padding:3px 10px;box-shadow:none}' +
      '.sec{display:flex;flex-direction:column;gap:6px}' +
      '.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:' + t.muted + '}' +
      'input,select{font:13px ' + F + ';padding:9px 10px;border:' + t.inputBorder + ';background:' + t.inputBg + ';color:' + t.text + ';border-radius:' + t.rIn + ';min-width:0}' +
      '.row{display:flex;gap:6px;flex-wrap:wrap}' +
      '.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;box-shadow:none;font-weight:500}.chip img{border-radius:3px}' +
      '.sec button{box-shadow:none;align-self:flex-start}';
  }

  function showError(w, msg, link, details) {
    var d = w.document;
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + TITLE + '</title>' + ICON_TAG + '<style>' + pageCss() + '</style></head>' +
      '<body><div class="card"><h2>Could not load this page</h2><p id="m"></p><div id="l"></div>' +
      '<p><a id="a" target="_blank" rel="noreferrer"></a></p></div></body></html>');
    d.close();
    d.getElementById("m").textContent = msg;
    if (details && details.length) {
      var ul = d.createElement("ul");
      details.forEach(function (t) {
        var li = d.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
      d.getElementById("l").appendChild(ul);
    }
    var a = d.getElementById("a");
    a.href = link;
    a.textContent = "Open the site in a normal tab";
    lockTitle(w);
  }

  // ---- Connection ----------------------------------------------------
  // No proxies: the page is requested straight from the site by the browser.
  function applyProxy(v) {
    PROXY_URL = String(v || "").trim();
    if (PROXY_URL && !/^https?:\/\//i.test(PROXY_URL)) PROXY_URL = "https://" + PROXY_URL;
    PROXY_BASE = PROXY_URL.replace(/\/+$/, "");
    CAN_HTTP = PROXY_BASE ? true : location.protocol !== "https:";
    if (PROXY_BASE) {
      // Through a proxy, big sites are fine: more and larger files, and more patience.
      MAX_FILES = 600; MAX_BYTES = 120 * 1024 * 1024; MAX_FILE = 25 * 1024 * 1024;
      PAGE_TIMEOUT = 45000; ASSET_TIMEOUT = 25000;
      DIRECT = { name: "Your proxy", frame: true, binary: true,
        build: function (u) { return PROXY_BASE + "/proxy?url=" + encodeURIComponent(u); },
        finalOf: function (res) { return res.headers.get("x-final-url"); },
        frameUrl: function (u) { return PROXY_BASE + "/proxy?mode=browse&url=" + encodeURIComponent(u); } };
    } else {
      MAX_FILES = 200; MAX_BYTES = 30 * 1024 * 1024; MAX_FILE = 6 * 1024 * 1024;
      PAGE_TIMEOUT = 20000; ASSET_TIMEOUT = 12000;
      DIRECT = { name: "Direct connection", frame: true, binary: true, build: function (u) { return u; } };
    }
  }
  function ident(t) { return t; }

  function store(key, fallback) {
    try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  applyProxy(store("notblank.proxy", ""));

  // ---- Loading engine ---------------------------------------------------
  var ctxs = new WeakMap(); // one state object per opened tab

  async function timedFetch(target, opts, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms);
    try {
      return await fetch(target, Object.assign({}, opts || {}, { signal: ctl.signal }));
    } finally { clearTimeout(timer); }
  }

  function whyFailed(e) {
    return e.name === "AbortError" ? "timed out"
      : (e.message === "Failed to fetch" ? "blocked or unreachable (CORS, down, or refused)" : e.message);
  }

  // Read a <meta http-equiv="refresh"> value such as "0; url=/next" or "30".
  function parseRefresh(content, base) {
    content = (content || "").trim();
    var same = content.match(/^([\d.]+)\s*;?\s*$/);
    if (same) return { delay: parseFloat(same[1]) || 0, url: base };
    var r = content.match(/^([\d.]*)\s*[;,]?\s*(?:url\s*=\s*)?['"]?([^'"]+)/i);
    if (!r || !r[2]) return null;
    try { return { delay: parseFloat(r[1]) || 0, url: new URL(r[2].trim(), base).href }; } catch (e) { return null; }
  }

  // Strip meta-refresh tags (the browser would otherwise follow them and leave this
  // tab) and report where they pointed.
  function pullRefresh(html, base) {

    lockTitle(w);
    var ctx = getCtx(w);
    d.getElementById("back").addEventListener("click", function () { ctx.step(0); });
    d.getElementById("go").addEventListener("click", function () {
      ctx.overrideSafety = ctx.overrideSafety || {};
      ctx.overrideSafety[url] = true;
      openSite(w, url, ctx.list, ctx.mode, null, { replace: true });
    });
  }

  async function openSite(w, url, list, mode, extraStatus, nav) {
    if (w.closed) return;
    nav = nav || {};
    var ctx = getCtx(w);
    ctx.list = list;
    ctx.mode = mode;
    if (!ctx.hasPage) ctx.url = url;
    var token = ++ctx.token;
    ctx.redirects = nav.auto ? ctx.redirects + 1 : 0;   // counts back-to-back automatic redirects
    if (!ctx.hasPage) showLoading(w, mode);
    installReload(ctx);
    installCleanup(ctx);
    var kind = classifyUrl(url);
    if (kind && !(ctx.overrideSafety && ctx.overrideSafety[url])) { showBlocked(w, kind, url); ctx.ensure(); return; }
    var force = mode === "force";

    var status = function (t) {
      if (token !== ctx.token) return;
      try { var el = w.document.getElementById("nbstat"); if (el) el.textContent = t; } catch (e) {}
      if (ctx.hasPage) ctx.setMsg(t);
      if (extraStatus) extraStatus(t);
    };
    var fails = [];
    var cancelled = function () { return token !== ctx.token || w.closed; };
    var wait = function (on) { if (token === ctx.token) ctx.showRetry(on, url); };
    var fail = function (msg, details) {
      if (token !== ctx.token) return;
      if (typeof nav.prevPos === "number") ctx.pos = nav.prevPos;
      if (ctx.hasPage) {
        ctx.setMsg(msg + (details && details.length ? " (" + details[0] + ")" : "") + " Staying on the current page.");
        setTimeout(function () { if (token === ctx.token) ctx.setMsg(""); }, 10000);
      } else {
        showError(w, msg, url, details);
        ctx.ensure();
      }
    };
    if (ctx.redirects > 10 && !force) {
      fail("This site redirected more than 10 times in a row, so loading was stopped. It may be stuck in a redirect loop.");
      return;
    }
    var commit = function (finalUrl) {
      ctx.url = finalUrl;           // the address after any server redirects
      ctx.baseHref = finalUrl;
      if (nav.traverse || (nav.replace && ctx.stack.length)) {
        ctx.stack[ctx.pos] = finalUrl;
      } else {
        ctx.stack = ctx.stack.slice(0, ctx.pos + 1);
        ctx.stack.push(finalUrl);
        ctx.pos = ctx.stack.length - 1;
      }
    };
    // Frame Mode, and the last resort for Force Load: the site runs inside a frame.
    var showInFrame = function (note) {
      if (token !== ctx.token || w.closed) return;
      var p0 = list[0];
      commit(url);
      showFrame(w, p0 && p0.frameUrl ? p0.frameUrl(url) : secureUrl(url));
      ctx.hasPage = true;
      ctx.setMsg(note || "");
      ctx.ensure();
      ctx.applyIdentity();
    };
    var done = function (html, finalUrl, refresh) {
      if (token !== ctx.token || w.closed) return;
      var scanned = scanForThreats(html);
      if (!scanned) { showBlocked(w, "malware", url); ctx.ensure(); return; }
      html = scanned.html;
      commit(finalUrl);
      installHooks(ctx);            // before the page's scripts run, so early redirects are caught
      writeHtml(w, html);
      ctx.hasPage = true;
      installHooks(ctx);
      ctx.setMsg("");
      if (scanned.removed.length) {
        var rmsg = "Cleaned up " + scanned.removed.length + " unsafe item" + (scanned.removed.length > 1 ? "s" : "") + " from this page (" + scanned.removed.join(", ") + ").";
        ctx.setMsg(rmsg);
        setTimeout(function () { if (ctx.lastMsg === rmsg) ctx.setMsg(""); }, 10000);
      }
      if (nav.note) {
        var note = nav.note;
        ctx.setMsg(note);
        setTimeout(function () { if (ctx.lastMsg === note) ctx.setMsg(""); }, 10000);
      }
      ctx.ensure();
      ctx.applyIdentity();
      if (refresh) {
        setTimeout(function () {
          if (token === ctx.token) ctx.go(refresh.url, { auto: true, replace: true });
        }, Math.min(refresh.delay, 30) * 1000);
      }
    };
    try {
      if (mode === "frame") { showInFrame(""); return; }
      var r = await extractPage(url, list, status, fails, cancelled, wait, force);
      if (token === ctx.token) ctx.showRetry(false);
      if (token !== ctx.token) return;
      if (r) { done(r.html, r.base, r.refresh); return; }   // null otherwise only when stopped
      if (force) showInFrame("Force Load: the page could not be downloaded, so the site was opened in a frame instead.");
    } catch (err) {
      if (force) showInFrame("Force Load: something went wrong (" + err.message + "), so the site was opened in a frame instead.");
      else fail("Something went wrong: " + err.message, fails);
    }
  }

  // ---- Launcher tab ----------------------------------------------------
  function buildLauncher(w) {
    var d = w.document;
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + LAUNCHER_TITLE + '</title>' + ICON_TAG +
      '<style>' + launcherCss() + '</style></head><body><main class="card">' +
      '<form id="f"><div class="brand"><span class="dot"></span><h1>' + LAUNCHER_TITLE + '</h1></div>' +
      '<p class="sub">Open any website inside this tab.</p>' +
      '<div><label class="lbl" for="u">Website address</label>' +
      '<input id="u" type="text" inputmode="url" placeholder="example.com" autocomplete="off" spellcheck="false"></div>' +
      '<div><label class="lbl" for="px">Proxy address (optional)</label>' +
      '<input id="px" type="text" inputmode="url" placeholder="https://your-proxy.workers.dev" autocomplete="off" spellcheck="false">' +
      '<p class="foot" style="margin-top:.4rem">A proxy you run (see worker.js or server.js) lets sites that block direct access load, including large ones. Leave it empty to load sites directly.</p></div>' +
      '<div><label class="lbl">Loading Mode</label><div class="modes" role="radiogroup" aria-label="Loading Mode">' + loadModeRadios(loadKey()) + '</div></div>' +
      '<button class="primary" type="submit">Open in new about:blank tab</button><div id="s" role="status"></div>' +
      '<div><label class="lbl" for="ui">Interface style</label><select id="ui">' + UI_OPTIONS + '</select></div>' +
      '<p class="foot">Links, forms and redirects open in another about:blank tab, so allow popups. If a site refuses, it keeps trying until it loads. Use Stop in the corner to give up. Every tab has its own Reload and Admin buttons.</p></form>' +
      '</main></body></html>');

    d.close();
    lockTitle(w, LAUNCHER_TITLE);

    var $ = function (id) { return d.getElementById(id); };
    var status = function (t) { $("s").textContent = t; };

    $("ui").value = uiKey();
    $("ui").addEventListener("change", function () {
      save("notblank.ui", $("ui").value);
      var keep = $("u").value;
      buildLauncher(w);                 // redraw this page in the chosen style
      var again = w.document.getElementById("u");
      again.value = keep;
      again.focus();
    });
    $("px").value = store("notblank.proxy", "");
    $("u").focus();

    $("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var url = normalize($("u").value);
      if (!url) { status("Enter a website address."); return; }
      var pv = $("px").value.trim();
      if (pv) { try { new URL(/^https?:\/\//i.test(pv) ? pv : "https://" + pv); } catch (err) { status("That proxy address is not valid."); return; } }
      save("notblank.proxy", pv);
      applyProxy(pv);
      var list = [DIRECT];
      try { new URL(url); } catch (err) { status("That doesn't look like a valid web address."); return; }
      var lm = d.querySelector('input[name="lm"]:checked');
      var mode = lm ? lm.value : loadKey();
      save("notblank.load", mode);
      var w2 = w.open("about:blank", "_blank");
      if (!w2) { status("Popup blocked. Allow popups for this site and try again."); return; }
      w2.document.title = TITLE;
      openSite(w2, url, list, mode, status);
    });
  }

  // Every shortcut opens the same Assignment Shortcut address page in an about:blank tab.
  function openLauncher() {
    var w = window.open("about:blank", "_blank");
    if (!w) { alert("Popup blocked. Allow popups for this site and click again."); return; }
    buildLauncher(w);
  }
  // Each shortcut goes to the site it names. Pressing S switches them all, silently, to
  // the address page instead; pressing S again switches back. Nothing is shown on screen
  // and nothing is saved, so reloading the page always starts with the normal links.
  var swapped = false;
  Array.prototype.forEach.call(document.querySelectorAll(".shortcut"), function (a) {
    a.addEventListener("click", function (e) {
      if (!swapped) return;             // normal: follow the link
      e.preventDefault();
      openLauncher();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "s" && e.key !== "S") return;
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || (t && t.isContentEditable)) return;
    swapped = !swapped;
  });

  // Interface style switch (look only; nothing else changes).
  var uiSel = document.getElementById("ui");
  function applyMainUi(k) {
    if (k === "simple") document.documentElement.setAttribute("data-ui", "simple");
    else document.documentElement.removeAttribute("data-ui");
  }
  uiSel.value = uiKey();
  applyMainUi(uiKey());
  uiSel.addEventListener("change", function () {
    save("notblank.ui", uiSel.value);
    applyMainUi(uiSel.value);
  });
})();
</script>
</body>
