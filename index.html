<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About:NotBlank</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#f4f5f7;--fg:#12151b;--accent:#12151b;--accent-fg:#ffffff;--ring:#12151b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--fg:#e7eaf0;--accent:#5eead4;--accent-fg:#0b1210;--ring:#5eead4}}
:root[data-theme="dark"]{--bg:#0e1014;--fg:#e7eaf0;--accent:#5eead4;--accent-fg:#0b1210;--ring:#5eead4}
html,body{height:100%;margin:0}
body{background:radial-gradient(60rem 40rem at 50% 40%,color-mix(in srgb,var(--accent) 12%,var(--bg)),var(--bg));color:var(--fg);display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:600 1.15rem/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.01em;padding:1.1rem 2.4rem;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;border-radius:999px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 14px 36px color-mix(in srgb,var(--accent) 45%,transparent)}
button:active{transform:translateY(0)}
button:focus-visible{outline:3px solid var(--ring);outline-offset:4px}
</style>
</head>
<body>
<button id="go" type="button">About:NotBlank</button>
<script>
(function () {
  var TITLE = "About:NotBlank";
  // Default tab icon: favicon.ico next to this page (about:blank tabs need the full address).
  var HOME_ICON = /^https?:$/.test(location.protocol)
    ? new URL("favicon.ico", location.href).href
    : "https://raw.githubusercontent.com/Camhub386/About-NotBlank/refs/heads/main/favicon.ico";
  var ICON_TAG = '<link rel="icon" href="' + HOME_ICON + '">';

  function normalize(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  function lockTitle(w) {
    function want() { var c = ctxs.get(w); return (c && c.title) || TITLE; }
    try {
      w.document.title = want();
      var t = w.document.querySelector("title");
      if (t) new w.MutationObserver(function () {
        if (w.document.title !== want()) w.document.title = want();
      }).observe(t, { childList: true, characterData: true, subtree: true });
    } catch (e) {}
  }

  function showFrame(w, url) {
    w.document.open();
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + TITLE +
      '</title><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head><body></body></html>');
    w.document.close();
    var f = w.document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-downloads");
    f.src = url;
    w.document.body.appendChild(f);
    lockTitle(w);
  }

  async function fetchText(u) {
    var r = await fetch(u, { mode: "cors" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return { text: await r.text(), url: r.url };
  }

  function writeDoc(w, html, baseHref) {
    var base = '<base href="' + baseHref.replace(/"/g, "&quot;") + '">';
    html = /<head[^>]*>/i.test(html)
      ? html.replace(/<head[^>]*>/i, function (m) { return m + base; })
      : base + html;
    w.document.open();
    w.document.write(html);
    w.document.close();
    lockTitle(w);
  }

  var PAGE_CSS = 'html,body{height:100%;margin:0}' +
    'body{background:#0e1014;color:#e7eaf0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center}' +
    '.card{width:min(30rem,90vw);box-sizing:border-box;background:#161a21;border:1px solid #2a303b;border-radius:16px;padding:1.5rem;box-shadow:0 10px 40px rgba(0,0,0,.4)}' +
    'h2{margin:0 0 .5rem;font-size:1.1rem}p{margin:.4rem 0;color:#aab2c0;line-height:1.5}' +
    'ul{color:#aab2c0;padding-left:1.2rem;font-size:.85rem;line-height:1.5}a{color:#5eead4}' +
    '.spin{width:22px;height:22px;border:3px solid #2a303b;border-top-color:#5eead4;border-radius:50%;animation:s .8s linear infinite;margin-bottom:.8rem}' +
    '@keyframes s{to{transform:rotate(360deg)}}';

  function showError(w, msg, link, details) {
    var d = w.document;
    d.open();
    d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + TITLE + '</title>' + ICON_TAG + '<style>' + PAGE_CSS + '</style></head>' +
      '<body><div class="card"><h2>Could not load this page</h2><p id="m"></p><div id="l"></div>' +
      '<p><a id="a" target="_blank" rel="noreferrer"></a></p></div></body></html>');
    d.close();
    d.getElementById("m").textContent = msg;
    if (details && details.length) {
      var ul = d.createElement("ul");
      details.forEach(function (t) {
        var li = d.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
      d.getElementById("l").appendChild(ul);
    }
    var a = d.getElementById("a");
    a.href = link;
    a.textContent = "Open the site in a normal tab";
    lockTitle(w);
  }

  // ---- Connection ----------------------------------------------------
  // No proxies: the page is requested straight from the site by the browser.
  var DIRECT = { name: "Direct connection", frame: true, binary: true, build: function (u) { return u; } };
  function ident(t) { return t; }

  function store(key, fallback) {
    try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // ---- Loading engine ---------------------------------------------------
  var MAX_FILES = 200, MAX_BYTES = 30 * 1024 * 1024, MAX_FILE = 6 * 1024 * 1024;
  var ctxs = new WeakMap(); // one state object per opened tab

  async function timedFetch(target, opts, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms);
    try {
      return await fetch(target, Object.assign({}, opts || {}, { signal: ctl.signal }));
    } finally { clearTimeout(timer); }
  }

  function whyFailed(e) {
    return e.name === "AbortError" ? "timed out"
      : (e.message === "Failed to fetch" ? "blocked or unreachable (CORS, down, or refused)" : e.message);
  }

  // Read a <meta http-equiv="refresh"> value such as "0; url=/next" or "30".
  function parseRefresh(content, base) {
    content = (content || "").trim();
    var same = content.match(/^([\d.]+)\s*;?\s*$/);
    if (same) return { delay: parseFloat(same[1]) || 0, url: base };
    var r = content.match(/^([\d.]*)\s*[;,]?\s*(?:url\s*=\s*)?['"]?([^'"]+)/i);
    if (!r || !r[2]) return null;
    try { return { delay: parseFloat(r[1]) || 0, url: new URL(r[2].trim(), base).href }; } catch (e) { return null; }
  }

  // Strip meta-refresh tags (the browser would otherwise follow them and leave this
  // tab) and report where they pointed.
  function pullRefresh(html, base) {
    var refresh = null;
    html = html.replace(/<meta\b[^>]*http-equiv\s*=\s*["']?refresh["']?[^>]*>/gi, function (tag) {
      var c = tag.match(/content\s*=\s*"([^"]*)"/i) || tag.match(/content\s*=\s*'([^']*)'/i) || tag.match(/content\s*=\s*([^\s>]+)/i);
      if (c && !refresh) refresh = parseRefresh(c[1], base);
      return "";
    });
    return { html: html, refresh: refresh };
  }

  // The same address with "www." added or removed; some redirects only work one way.
  function variants(url) {
    var out = [url];
    try {
      var x = new URL(url);
      x.hostname = /^www\./i.test(x.hostname) ? x.hostname.replace(/^www\./i, "") : "www." + x.hostname;
      out.push(x.href);
    } catch (e) {}
    return out;
  }

  // Wait, counting down, but give up waiting the moment loading is cancelled.
  async function waitFor(ms, cancelled, tick) {
    var end = Date.now() + ms;
    while (Date.now() < end && !cancelled()) {
      if (tick) tick(Math.ceil((end - Date.now()) / 1000));
      await new Promise(function (r) { setTimeout(r, 250); });
    }
  }

  // Get the page's HTML. The browser follows server redirects itself, so the address
  // it ended up at (res.url) becomes the page's real address. If the site refuses, the
  // request is repeated, alternating between the www and non-www form, with a pause that
  // grows to 30 seconds, until it works or the user presses Stop. Error pages that still
  // contain real HTML are shown rather than counted as a failure.
  async function fetchPage(list, url, status, fails, cancelled, wait) {
    var round = 0, delay = 1500;
    while (!cancelled()) {
      round++;
      var latest = [];
      for (var i = 0; i < list.length; i++) {
        var p = list[i], tries = variants(url);
        for (var v = 0; v < tries.length; v++) {
          if (cancelled()) return null;
          status(round === 1 && !v ? "Loading " + url + " ..." : "Attempt " + round + ": trying " + tries[v] + " ...");
          try {
            var res = await timedFetch(p.build(tries[v]), Object.assign({}, p.opts || {}, round > 1 ? { cache: "no-store" } : {}), 20000);
            var html = (p.parse || ident)(await res.text());
            var ct = res.headers.get("content-type") || "";
            if (!res.ok && !(/html/i.test(ct) && html && html.length >= 200)) throw new Error("HTTP " + res.status);
            if (!html || html.length < 20) throw new Error("empty response");
            var finalUrl = res.url && /^https?:\/\//i.test(res.url) ? res.url : tries[v];
            return { html: html, base: p.base ? p.base(finalUrl) : finalUrl, finalUrl: finalUrl, redirected: res.redirected, proxy: p };
          } catch (e) {
            latest.push(p.name + " (" + tries[v] + "): " + whyFailed(e));
          }
        }
      }
      fails.length = 0;
      Array.prototype.push.apply(fails, latest);
      if (wait) wait(true);
      var why = latest.length ? latest[latest.length - 1].replace(/^.*?\): /, "") : "refused";
      await waitFor(delay, cancelled, function (n) {
        status("Attempt " + round + " failed (" + why + "). Trying again in " + n + "s ...");
      });
      delay = Math.min(delay * 1.6, 30000);
    }
    return null;
  }

  function guessMime(u) {
    var m = (u.split(/[?#]/)[0].match(/\.([a-z0-9]+)$/i) || [])[1];
    var t = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp",
      svg: "image/svg+xml", ico: "image/x-icon", json: "application/json", css: "text/css", mp3: "audio/mpeg", ogg: "audio/ogg", wav: "audio/wav", avif: "image/avif", woff: "font/woff", woff2: "font/woff2",
      ttf: "font/ttf", otf: "font/otf", eot: "application/vnd.ms-fontobject", mp4: "video/mp4", webm: "video/webm" };
    return t[(m || "").toLowerCase()] || "application/octet-stream";
  }

  function toDataUri(blob, url) {
    var type = blob.type && blob.type !== "application/octet-stream" ? blob.type : guessMime(url);
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsDataURL(new Blob([blob], { type: type }));
    });
  }

  // Download one file through the selected file-capable proxies. kind: "text" or "data".
  // Returns null on failure, so the caller can link the original file instead.
  function fetchAsset(ctx, url, kind) {
    if (!/^https?:\/\//i.test(url)) return Promise.resolve(null);
    var key = kind + "|" + url;
    if (ctx.cache.has(key)) return ctx.cache.get(key);
    var job = (async function () {
      if (!ctx.assetProxies.length || ctx.count >= MAX_FILES) return null;
      ctx.count++;
      for (var i = 0; i < ctx.assetProxies.length; i++) {
        var p = ctx.assetProxies[i];
        try {
          var res = await timedFetch(p.build(url), p.opts, 12000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          var ct = res.headers.get("content-type") || "";
          if (/text\/html/i.test(ct)) throw new Error("returned a web page, not a file");
          if (kind === "text") {
            var t = await res.text();
            ctx.finalOf[url] = res.url && /^https?:\/\//i.test(res.url) ? res.url : url;
            if (ctx.bytes + t.length > MAX_BYTES) return null;
            ctx.bytes += t.length;
            return t;
          }
          var b = await res.blob();
          if (b.size > MAX_FILE || ctx.bytes + b.size > MAX_BYTES) return null;
          ctx.bytes += b.size;
          return await toDataUri(b, url);
        } catch (e) {}
      }
      return null;
    })();
    ctx.cache.set(key, job);
    return job;
  }

  async function pool(tasks, n, onDone) {
    var i = 0, done = 0;
    async function worker() {
      while (i < tasks.length) {
        var t = tasks[i++];
        try { await t(); } catch (e) {}
        done++;
        if (onDone) onDone(done, tasks.length);
      }
    }
    var ws = [];
    for (var k = 0; k < n; k++) ws.push(worker());
    await Promise.all(ws);
  }

  // Inline @import files and url(...) images/fonts inside a stylesheet.
  async function processCss(css, cssUrl, ctx, depth) {
    cssUrl = (ctx.finalOf && ctx.finalOf[cssUrl]) || cssUrl;   // where the file really came from
    var imports = [];
    css.replace(/@import\s+(?:url\(\s*)?(['"]?)([^'")\s;]+)\1\s*\)?[^;]*;/g, function (m, q, u) { imports.push([m, u]); return m; });
    for (var i = 0; i < imports.length; i++) {
      var abs = new URL(imports[i][1], cssUrl).href;
      var inner = depth < 3 ? await fetchAsset(ctx, abs, "text") : null;
      css = css.split(imports[i][0]).join(inner ? await processCss(inner, abs, ctx, depth + 1) : "");
    }
    var urls = {};
    var re = /url\(\s*(['"]?)(?!data:|#|about:|blob:)([^'")]+?)\1\s*\)/g, m;
    while ((m = re.exec(css))) {
      try { urls[m[2]] = new URL(m[2].trim(), cssUrl).href; } catch (e) {}
    }
    var keys = Object.keys(urls), got = {};
    await pool(keys.map(function (k) { return async function () { got[k] = (await fetchAsset(ctx, urls[k], "data")) || urls[k]; }; }), 6);
    return css.replace(re, function (all, q, u) {
      return got[u] ? 'url("' + got[u] + '")' : all;
    });
  }

  // Download every file the page uses and rebuild it as one self-contained document.
  async function extractPage(url, list, status, fails, cancelled, wait) {
    var page = await fetchPage(list, url, status, fails, cancelled, wait);
    if (!page) return null;
    var doc = new DOMParser().parseFromString(page.html, "text/html");
    var baseEl = doc.querySelector("base[href]");
    var base = page.base;
    try { if (baseEl) base = new URL(baseEl.getAttribute("href"), page.base).href; } catch (e) {}
    var abs = function (u) { try { return new URL(u, base).href; } catch (e) { return u; } };

    var ctx = {
      cache: new Map(), count: 0, bytes: 0, finalOf: {}, pathBudget: 40,
      assetProxies: list.filter(function (p) { return p.binary; })
    };

    // Remove things that would pull the visitor off the page or block inlined code.
    var refresh = null;
    doc.querySelectorAll("base").forEach(function (b) { b.remove(); });
    doc.querySelectorAll('meta[http-equiv]').forEach(function (m) {
      var he = (m.getAttribute("http-equiv") || "").toLowerCase();
      if (he === "content-security-policy") m.remove();
      if (he === "refresh") {
        refresh = refresh || parseRefresh(m.getAttribute("content"), base);
        m.remove();
      }
    });

    var tasks = [];
    doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(function (l) {
      tasks.push(async function () {
        var u = abs(l.getAttribute("href"));
        var css = await fetchAsset(ctx, u, "text");
        if (css == null) { l.setAttribute("href", u); return; }
        var st = doc.createElement("style");
        st.textContent = await processCss(css, u, ctx, 0);
        if (l.getAttribute("media")) st.setAttribute("media", l.getAttribute("media"));
        l.replaceWith(st);
      });
    });
    doc.querySelectorAll("style").forEach(function (st) {
      tasks.push(async function () { st.textContent = await processCss(st.textContent, base, ctx, 0); });
    });
    doc.querySelectorAll("script[src]").forEach(function (sc) {
      tasks.push(async function () {
        var u = abs(sc.getAttribute("src"));
        var type = (sc.getAttribute("type") || "").toLowerCase();
        sc.setAttribute("src", u);
        if (type === "module" || sc.hasAttribute("nomodule")) return;
        var js = await fetchAsset(ctx, u, "text");
        if (js == null) return;
        sc.removeAttribute("src");
        sc.removeAttribute("integrity");
        sc.removeAttribute("crossorigin");
        if (sc.hasAttribute("defer")) { sc.removeAttribute("defer"); sc.setAttribute("data-nb-defer", ""); }
        sc.textContent = rewriteLoc(await scanPaths(js, base, ctx)).replace(/<\/script/gi, "<\\/script");
      });
    });
    doc.querySelectorAll("script:not([src])").forEach(function (sc) {
      var type = (sc.getAttribute("type") || "").toLowerCase();
      if (type && !/javascript|module/.test(type)) return;
      tasks.push(async function () {
        sc.textContent = rewriteLoc(await scanPaths(sc.textContent, base, ctx)).replace(/<\/script/gi, "<\\/script");
      });
    });
    doc.querySelectorAll("picture source").forEach(function (s) { s.remove(); });
    doc.querySelectorAll("img").forEach(function (img) {
      tasks.push(async function () {
        var src = img.getAttribute("src");
        if (!src) {
          var ss = (img.getAttribute("srcset") || "").split(",")[0].trim().split(/\s+/)[0];
          src = ss || null;
        }
        img.removeAttribute("srcset");
        img.removeAttribute("sizes");
        if (!src || /^data:/i.test(src)) return;
        var u = abs(src);
        img.setAttribute("src", (await fetchAsset(ctx, u, "data")) || u);
      });
    });
    doc.querySelectorAll('[style*="url("]').forEach(function (el) {
      tasks.push(async function () {
        el.setAttribute("style", await processCss(el.getAttribute("style"), base, ctx, 0));
      });
    });

    await pool(tasks, 8, function (done, total) {
      status("Downloading files " + done + " of " + total + " ...");
    });

    // Inline handlers such as onclick="location.href='/next'".
    doc.querySelectorAll("*").forEach(function (el) {
      Array.prototype.forEach.call(el.attributes, function (a) {
        if (/^on/i.test(a.name) && /location/.test(a.value)) el.setAttribute(a.name, rewriteLoc(a.value));
      });
    });

    // Scripts that were deferred run after the page body, as they would in a browser.
    doc.querySelectorAll("script[data-nb-defer]").forEach(function (sc) {
      sc.removeAttribute("data-nb-defer");
      doc.body.appendChild(sc);
    });
    var shim = doc.createElement("script");
    shim.textContent = locShim(page.finalUrl).replace(/^<script>/, "").replace(/<\/script>$/, "");
    doc.head.insertBefore(shim, doc.head.firstChild);
    var bt = doc.createElement("base");
    bt.setAttribute("href", base);
    doc.head.insertBefore(bt, doc.head.firstChild);

    return { html: "<!DOCTYPE html>\n" + doc.documentElement.outerHTML, base: page.finalUrl, refresh: refresh };
  }

  // ---- Keeping the real address visible to the site's own scripts ------------
  // Inside an about:blank tab, scripts that read or set location.pathname/search/
  // href see "about:blank" instead of the real address, and a redirect that sets
  // location.search lands on a blank page. The scripts are pointed at a small stand-in
  // object that reports the real address and sends changes through the normal
  // redirect handling.
  function locShim(finalUrl) {
    var R = JSON.stringify(finalUrl).replace(/</g, "\\u003c");
    return '<script>(function(){try{var R=new URL(' + R + ');var L=window.location;' +
      'function to(u){return new URL(u,R.href).href}' +
      'function part(k,v){var u=new URL(R.href);u[k]=v;return u.href}' +
      'window.__nbLoc={get href(){return R.href},set href(v){L.href=to(v)},get origin(){return R.origin},' +
      'get protocol(){return R.protocol},get host(){return R.host},get hostname(){return R.hostname},get port(){return R.port},' +
      'get pathname(){return R.pathname},set pathname(v){L.href=part("pathname",v)},' +
      'get search(){return R.search},set search(v){L.href=part("search",v)},' +
      'get hash(){return L.hash},set hash(v){L.hash=v},' +
      'assign:function(v){L.href=to(v)},replace:function(v){L.replace(to(v))},reload:function(){L.reload()},' +
      'toString:function(){return R.href}}}catch(e){}})();<\/script>';
  }

  var LOC_RE = /(?:(?<![\w$.])|\b(?:window|document|top|self|parent)\.)location\.(href|origin|protocol|host|hostname|port|pathname|search|hash|assign|replace|reload|toString)\b/g;
  function rewriteLoc(js) {
    return js.replace(LOC_RE, "window.__nbLoc.$1").replace(/\bdocument\.URL\b/g, "window.__nbLoc.href");
  }

  // Same rewrite for the inline scripts of a raw HTML string (normal mode).
  function rewriteInline(html) {
    return html.replace(/(<script\b)([^>]*)(>)([\s\S]*?)(<\/script>)/gi, function (m, a, attrs, c, body, e) {
      if (/\bsrc\s*=/i.test(attrs)) return m;
      var tm = attrs.match(/\btype\s*=\s*["']?([^"'\s>]+)/i);
      if (tm && !/javascript|module/i.test(tm[1])) return m;
      return a + attrs + c + rewriteLoc(body) + e;
    });
  }

  // Files named by path inside scripts, e.g. "/img/logo.png" or "data/menu.json".
  var PATH_RE = /(["'])((?:\.{1,2}\/|\/)?(?:[\w@%~.\-]+\/)*[\w@%~\-]+\.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|mp3|ogg|wav|css|json))(\?[^"'\s]*)?\1/gi;
  async function scanPaths(text, base, ctx) {
    if (ctx.pathBudget <= 0) return text;
    var found = {}, m, re = new RegExp(PATH_RE.source, "gi");
    while ((m = re.exec(text)) && Object.keys(found).length < ctx.pathBudget) found[m[2] + (m[3] || "")] = 1;
    var keys = Object.keys(found);
    if (!keys.length) return text;
    ctx.pathBudget -= keys.length;
    var got = {};
    await pool(keys.map(function (k) {
      return async function () {
        try { var du = await fetchAsset(ctx, new URL(k, base).href, "data"); if (du) got[k] = du; } catch (e) {}
      };
    }), 6);
    return text.replace(new RegExp(PATH_RE.source, "gi"), function (all, q, path, qs) {
      var k = path + (qs || "");

      'input:focus-visible+.track{outline:2px solid #5eead4;outline-offset:2px}' +
      '.switch b{display:block;font-size:.95rem}.switch small{display:block;color:#9aa3b2;line-height:1.4;margin-top:.15rem}' +
      'button.primary{font:600 1rem system-ui,sans-serif;padding:.95rem 1rem;border:0;border-radius:12px;background:#5eead4;color:#0b1210;cursor:pointer;transition:background .15s}' +
      'button.primary:hover{background:#7ff0de}' +
      '#s{min-height:1.2em;font-size:.9rem;color:#9aa3b2}' +
      '.foot{margin:0;color:#6f7888;font-size:.8rem;line-height:1.5}' +
      '</style></head><body><main class="card">' +
      '<form id="f"><div class="brand"><span class="dot"></span><h1>' + TITLE + '</h1></div>' +
      '<p class="sub">Open any website inside this tab.</p>' +
      '<div><label class="lbl" for="u">Website address</label>' +
      '<input id="u" type="text" inputmode="url" placeholder="example.com" autocomplete="off" spellcheck="false"></div>' +
      '<label class="switch"><input type="checkbox" id="ext"><span class="track"></span>' +
      '<span><b>Extract mode</b><small>Download the page\'s files separately and rebuild it here, instead of loading it as one piece.</small></span></label>' +
      '<button class="primary" type="submit">Open in new about:blank tab</button><div id="s" role="status"></div>' +
      '<p class="foot">Links, forms and redirects open in another about:blank tab, so allow popups. If a site refuses, it keeps trying until it loads. Use Stop in the corner to give up. Every tab has its own Reload and Admin buttons.</p></form>' +
      '</main></body></html>');
    d.close();
    lockTitle(w);

    var $ = function (id) { return d.getElementById(id); };
    var status = function (t) { $("s").textContent = t; };

    $("ext").checked = store("notblank.ext", false);
    $("ext").addEventListener("change", function () { save("notblank.ext", $("ext").checked); });
    $("u").focus();

    $("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var url = normalize($("u").value);
      if (!url) { status("Enter a website address."); return; }
      var list = [DIRECT];
      try { new URL(url); } catch (err) { status("That doesn't look like a valid web address."); return; }
      var w2 = w.open("about:blank", "_blank");
      if (!w2) { status("Popup blocked. Allow popups for this site and try again."); return; }
      w2.document.title = TITLE;
      openSite(w2, url, list, $("ext").checked ? "extract" : "basic", status);
    });
  }

  document.getElementById("go").addEventListener("click", function () {
    var w = window.open("about:blank", "_blank");
    if (!w) { alert("Popup blocked. Allow popups for this site and click again."); return; }
    buildLauncher(w);
  });
})();
</script>
</body>
</html>
